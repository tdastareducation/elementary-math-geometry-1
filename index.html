ents in a class. [[1;4]] of them wear glasses. [[1;3]] of the other students wear braces. How many students wear neither glasses nor braces?", "a": "18", "u": "students", "s": "Glasses: 36 ÷ 4 = 9 → others: 36 – 9 = 27;;Braces: 27 ÷ 3 = 9;;Neither: 27 – 9 = 18"}, {"t": "A car’s fuel tank holds 60 L and it is full. A trip uses [[1;3]] of the fuel, then 12 L is added and the next trip uses half of the fuel in the tank. How many litres are left?", "a": "26", "u": "L", "s": "First trip: 60 ÷ 3 = 20 → 60 – 20 = 40;;Added: 40 + 12 = 52;;Second trip: 52 ÷ 2 = 26 → 52 – 26 = 26"}, {"t": "A baker has 18 kg of flour. Each bread needs [[3;4]] kg of flour and he sells every bread for 18 TL. The flour costs 20 TL per kg. How much profit does he make?", "a": "72", "u": "TL", "s": "Breads: 18 ÷ [[3;4]] = 18 × 4 ÷ 3 = 24;;Income: 24 × 18 = 432;;Flour cost: 18 × 20 = 360;;Profit: 432 – 360 = 72"}, {"t": "The temperature in Ankara is –7 °C. In Moscow it is 3 times the temperature in Ankara, and in Cairo it is 45 degrees more than in Moscow. What is the temperature in Cairo?", "a": "24", "u": "°C", "s": "Moscow: 3 × –7 = –21;;Cairo: –21 + 45 = 24"}, {"t": "A mountain hut is at 1800 m. A group climbs [[2;9]] of this altitude, goes down 650 m and then climbs twice as much as they went down. At what altitude are they now?", "a": "2850", "u": "m", "s": "Climbs: 1800 ÷ 9 × 2 = 400 → 1800 + 400 = 2200;;Down: 2200 – 650 = 1550;;Climbs twice 650 = 1300: 1550 + 1300 = 2850"}];
const GEO={"6": [{"n": 1, "title": "‘Complementary Angles’", "qs": [{"n": 1, "t": "In the figure, OA ⊥ OB. What is x in degrees?", "o": {"A": "63°", "B": "73°", "C": "83°", "D": "117°"}, "a": "A", "s": "∠AOC and ∠COB are adjacent complementary angles (OA ⊥ OB).;;x + 27° = 90°;;x = 90° – 27° = 63°", "f": "f154_1"}, {"n": 2, "t": "What is the measure of an angle whose complement is 4 times the angle itself?", "o": {"A": "14°", "B": "16°", "C": "18°", "D": "20°"}, "a": "C", "s": "Let the angle be a. Its complement is 4a.;;a + 4a = 90° ⇒ 5a = 90°;;a = 18°", "f": "f154_2"}, {"n": 3, "t": "In the figure, m(∠AOD) = 90°. What is m(∠COD)?", "o": {"A": "30°", "B": "35°", "C": "40°", "D": "45°"}, "a": "D", "s": "The three angles fill the right angle ∠AOD.;;x + 2x + 3x = 90° ⇒ 6x = 90° ⇒ x = 15°;;m(∠COD) = 3x = 45°", "f": "f154_3"}, {"n": 4, "t": "In the figure, OA ⊥ OB. Find x.", "o": {"A": "14", "B": "16", "C": "18", "D": "20"}, "a": "B", "s": "OA ⊥ OB, so the two angles are complementary.;;(2x + 15°) + (3x – 5°) = 90°;;5x + 10° = 90° ⇒ 5x = 80° ⇒ x = 16", "f": "f154_4"}, {"n": 5, "t": "In the figure, m(∠AOC) = m(∠BOD) = 90°. What is x + y in degrees?", "o": {"A": "44°", "B": "54°", "C": "64°", "D": "74°"}, "a": "C", "s": "m(∠AOC) = 90°: x + 58° = 90° ⇒ x = 32°;;m(∠BOD) = 90°: 58° + y = 90° ⇒ y = 32°;;x + y = 32° + 32° = 64°", "f": "f155_1"}, {"n": 6, "t": "The difference between the measures of two complementary angles is 24°. What is the measure of the smaller angle?", "o": {"A": "33°", "B": "37°", "C": "41°", "D": "57°"}, "a": "A", "s": "a + b = 90° and a – b = 24°.;;Add them: 2a = 114° ⇒ a = 57°;;Smaller angle: b = 90° – 57° = 33°", "f": "f155_2"}, {"n": 7, "t": "OA ⊥ OC. Find x.", "o": {"A": "20", "B": "25", "C": "30", "D": "35"}, "a": "A", "s": "OA ⊥ OC, so the two angles are complementary.;;(x + 10°) + 3x = 90°;;4x = 80° ⇒ x = 20", "f": "f155_3"}, {"n": 8, "t": "The complement of an angle is 26° more than the angle itself. What is the measure of the angle?", "o": {"A": "22°", "B": "27°", "C": "32°", "D": "37°"}, "a": "C", "s": "Let the angle be a. Its complement is a + 26°.;;a + (a + 26°) = 90°;;2a = 64° ⇒ a = 32°", "f": "f155_4"}], "ch": 6}, {"n": 2, "title": "‘Supplementary Angles’", "qs": [{"n": 1, "t": "A, O and B are collinear. What is x in degrees?", "o": {"A": "24°", "B": "34°", "C": "44°", "D": "54°"}, "a": "D", "s": "Adjacent supplementary angles: 126° + x = 180°;;x = 180° – 126° = 54°", "f": "f156_1"}, {"n": 2, "t": "A, O and B are collinear. Find x.", "o": {"A": "15", "B": "20", "C": "25", "D": "30"}, "a": "B", "s": "A, O and B are collinear, so the angles are supplementary.;;(5x + 5°) + (3x + 15°) = 180°;;8x + 20° = 180° ⇒ 8x = 160° ⇒ x = 20", "f": "f156_2"}, {"n": 3, "t": "A, O and B are collinear. What is m(∠COD)?", "o": {"A": "60°", "B": "65°", "C": "70°", "D": "80°"}, "a": "A", "s": "Angles on a straight line: 4x + 3x + 2x = 180°;;9x = 180° ⇒ x = 20°;;m(∠COD) = 3x = 60°", "f": "f156_3"}, {"n": 4, "t": "The supplement of an angle is 40° more than the angle itself. What is the measure of the angle?", "o": {"A": "60°", "B": "65°", "C": "70°", "D": "110°"}, "a": "C", "s": "Let the angle be x. Its supplement is x + 40°.;;x + (x + 40°) = 180°;;2x = 140° ⇒ x = 70°", "f": "f156_4"}, {"n": 5, "t": "A, O and B are collinear and OC ⊥ OB. What is x in degrees?", "o": {"A": "15°", "B": "20°", "C": "25°", "D": "30°"}, "a": "D", "s": "OC ⊥ OB, so m(∠AOC) = 90°.;;2x + x = 90° ⇒ 3x = 90°;;x = 30°", "f": "f157_1"}, {"n": 6, "t": "The ratio of two supplementary angles a and b is a : b = 2 : 7. What is the measure of the bigger angle?", "o": {"A": "130°", "B": "140°", "C": "150°", "D": "160°"}, "a": "B", "s": "a = 2k and b = 7k.;;2k + 7k = 180° ⇒ 9k = 180° ⇒ k = 20°;;Bigger angle: b = 7k = 140°", "f": "f157_2"}, {"n": 7, "t": "A, O and B are collinear. What is the measure of the biggest angle?", "o": {"A": "70°", "B": "80°", "C": "90°", "D": "100°"}, "a": "B", "s": "Angles on a straight line: 2x + 3x + 4x = 180°;;9x = 180° ⇒ x = 20°;;Biggest angle: 4x = 80°", "f": "f157_3"}, {"n": 8, "t": "The supplement of an angle is 5 times the angle itself. What is the measure of the angle?", "o": {"A": "15°", "B": "20°", "C": "25°", "D": "30°"}, "a": "D", "s": "Let the angle be x. Its supplement is 5x.;;x + 5x = 180° ⇒ 6x = 180°;;x = 30°", "f": "f157_4"}], "ch": 6}, {"n": 3, "title": "‘Vertical Angles’", "qs": [{"n": 1, "t": "Two intersecting lines are given. What is x in degrees?", "o": {"A": "38°", "B": "132°", "C": "142°", "D": "152°"}, "a": "C", "s": "x and 38° are adjacent angles on a line.;;x + 38° = 180°;;x = 142°", "f": "f158_1"}, {"n": 2, "t": "Lines AB and CD intersect at point O. Find x.", "o": {"A": "20", "B": "25", "C": "30", "D": "35"}, "a": "A", "s": "The marked angles are vertical angles, so they are equal.;;4x – 15° = 2x + 25°;;2x = 40° ⇒ x = 20", "f": "f158_2"}, {"n": 3, "t": "Two intersecting lines are given. What is y in degrees?", "o": {"A": "36°", "B": "72°", "C": "82°", "D": "108°"}, "a": "B", "s": "Adjacent angles: 3x + 2x = 180° ⇒ 5x = 180° ⇒ x = 36°;;y and 2x are vertical angles.;;y = 2x = 72°", "f": "f158_3"}, {"n": 4, "t": "Three lines intersect at point O. What is x in degrees?", "o": {"A": "60°", "B": "65°", "C": "70°", "D": "75°"}, "a": "D", "s": "The vertical angle of 65° is also 65°; it is next to x.;;Straight line: 65° + x + 40° = 180°;;x = 75°", "f": "f158_4"}, {"n": 5, "t": "The angles formed by two intersecting lines are a, b, c and d. If a – b = 60°, what is c in degrees?", "o": {"A": "120°", "B": "130°", "C": "140°", "D": "150°"}, "a": "A", "s": "Adjacent angles: a + b = 180° and a – b = 60°.;;2a = 240° ⇒ a = 120°;;c and a are vertical angles: c = 120°", "f": "f159_1"}, {"n": 6, "t": "Lines AB and CD intersect at point O. If OE ⊥ AB and m(∠BOD) = 50°, what is x in degrees?", "o": {"A": "30°", "B": "35°", "C": "40°", "D": "45°"}, "a": "C", "s": "Vertical angles: m(∠AOC) = m(∠BOD) = 50°.;;OE ⊥ AB, so m(∠AOE) = 90°.;;x = 90° – 50° = 40°", "f": "f159_2"}, {"n": 7, "t": "Two lines intersect. What is y in degrees?", "o": {"A": "90°", "B": "100°", "C": "110°", "D": "120°"}, "a": "C", "s": "Vertical angles: 4x – 10° = 2x + 30° ⇒ x = 20;;So this angle is 4 · 20° – 10° = 70°.;;y is its adjacent angle: y = 180° – 70° = 110°", "f": "f159_3"}, {"n": 8, "t": "Three lines intersect at point O. What is x in degrees?", "o": {"A": "85°", "B": "95°", "C": "105°", "D": "115°"}, "a": "A", "s": "The vertical angle of 55° is also 55°; it is next to x.;;Straight line: 55° + x + 40° = 180°;;x = 85°", "f": "f159_4"}], "ch": 6}, {"n": 4, "title": "‘Angles Around a Point’", "qs": [{"n": 1, "t": "The angles around point O are given. What is x in degrees?", "o": {"A": "70°", "B": "75°", "C": "80°", "D": "85°"}, "a": "B", "s": "The angles around a point add up to 360°.;;95° + 110° + x + 80° = 360°;;285° + x = 360° ⇒ x = 75°", "f": "f160_1"}, {"n": 2, "t": "Find x by using the angles in the figure.", "o": {"A": "25", "B": "30", "C": "35", "D": "40"}, "a": "D", "s": "3x + 2x + 4x = 360°;;9x = 360°;;x = 40", "f": "f160_2"}, {"n": 3, "t": "According to the figure, what is the measure of the angle shown as 3x?", "o": {"A": "100°", "B": "110°", "C": "120°", "D": "130°"}, "a": "C", "s": "There is a right angle (90°).;;2x + 3x + (x + 30°) + 90° = 360°;;6x + 120° = 360° ⇒ x = 40°;;3x = 120°", "f": "f160_3"}, {"n": 4, "t": "The angles around point O are given. What is x in degrees?", "o": {"A": "55°", "B": "60°", "C": "65°", "D": "70°"}, "a": "A", "s": "80° + 60° + 2x + x + x = 360°;;4x + 140° = 360° ⇒ 4x = 220°;;x = 55°", "f": "f160_4"}, {"n": 5, "t": "According to the figure, what is the measure of the biggest angle?", "o": {"A": "100°", "B": "110°", "C": "120°", "D": "130°"}, "a": "B", "s": "(2x + 20°) + 3x + (x + 50°) + (4x – 10°) = 360°;;10x + 60° = 360° ⇒ x = 30°;;The angles are 80°, 90°, 80° and 110°. Biggest: 110°", "f": "f161_1"}, {"n": 6, "t": "Three angles around a point are proportional to 3, 4 and 5. What is the difference between the biggest and the smallest angle?", "o": {"A": "30°", "B": "50°", "C": "55°", "D": "60°"}, "a": "D", "s": "3k + 4k + 5k = 360° ⇒ 12k = 360° ⇒ k = 30°;;Difference: 5k – 3k = 2k = 60°", "f": "f161_2"}, {"n": 7, "t": "Find x by using the angles around point O.", "o": {"A": "15", "B": "20", "C": "25", "D": "30"}, "a": "D", "s": "There is a right angle (90°).;;90° + 2x + 3x + 4x = 360°;;9x = 270° ⇒ x = 30", "f": "f161_3"}, {"n": 8, "t": "The angles around point O are given. What is x in degrees?", "o": {"A": "75°", "B": "85°", "C": "95°", "D": "105°"}, "a": "B", "s": "95° + 70° + x + 110° = 360°;;275° + x = 360°;;x = 85°", "f": "f161_4"}], "ch": 6}, {"n": 5, "title": "‘The Angle Bisector’", "qs": [{"n": 1, "t": "Ray OC is the bisector of ∠AOB and m(∠AOB) = 126°. What is x in degrees?", "o": {"A": "63°", "B": "73°", "C": "83°", "D": "126°"}, "a": "A", "s": "The bisector divides the angle into two equal parts.;;x = 126° ÷ 2 = 63°", "f": "f162_1"}, {"n": 2, "t": "Ray OC is the bisector of ∠AOB. Find x.", "o": {"A": "10", "B": "15", "C": "20", "D": "25"}, "a": "B", "s": "The two parts of the bisected angle are equal.;;2x + 20° = 4x – 10°;;30° = 2x ⇒ x = 15", "f": "f162_2"}, {"n": 3, "t": "A, O and B are collinear; ray OD is the bisector of ∠BOC and m(∠AOD) = 130°. What is m(∠AOC)?", "o": {"A": "65°", "B": "70°", "C": "75°", "D": "80°"}, "a": "D", "s": "m(∠DOB) = 180° – 130° = 50°;;OD is the bisector: m(∠BOC) = 2 · 50° = 100°;;m(∠AOC) = 180° – 100° = 80°", "f": "f162_3"}, {"n": 4, "t": "A, O and B are collinear; rays OK and OL are the bisectors of ∠BOC and ∠COA. Find x.", "o": {"A": "5", "B": "10", "C": "15", "D": "20"}, "a": "C", "s": "The angle between the bisectors of adjacent supplementary angles is 90°.;;(3x + 10°) + (2x + 5°) = 90°;;5x + 15° = 90° ⇒ x = 15", "f": "f162_4"}, {"n": 5, "t": "OA ⊥ OC; rays OD and OE are the bisectors of ∠AOB and ∠BOC. What is m(∠DOE)?", "o": {"A": "30°", "B": "35°", "C": "40°", "D": "45°"}, "a": "D", "s": "∠AOB and ∠BOC are adjacent complementary angles (OA ⊥ OC).;;The angle between their bisectors is half of 90°.;;m(∠DOE) = 90° ÷ 2 = 45°", "f": "f163_1"}, {"n": 6, "t": "Ray OB is the bisector of ∠AOC and ray OC is the bisector of ∠BOD. If m(∠AOD) = 114°, what is m(∠AOC)?", "o": {"A": "76°", "B": "86°", "C": "96°", "D": "106°"}, "a": "A", "s": "m(∠AOB) = m(∠BOC) and m(∠BOC) = m(∠COD), so all three are equal.;;3 · m(∠AOB) = 114° ⇒ m(∠AOB) = 38°;;m(∠AOC) = 2 · 38° = 76°", "f": "f163_2"}, {"n": 7, "t": "Ray OC is the bisector of ∠AOB. What is m(∠AOB)?", "o": {"A": "76°", "B": "86°", "C": "96°", "D": "106°"}, "a": "A", "s": "The two parts are equal: 3x – 7° = 2x + 8° ⇒ x = 15;;Each part: 2 · 15° + 8° = 38°;;m(∠AOB) = 2 · 38° = 76°", "f": "f163_3"}, {"n": 8, "t": "A, O and B are collinear and ray OD is the bisector of ∠BOC. What is x?", "o": {"A": "45°", "B": "55°", "C": "65°", "D": "75°"}, "a": "C", "s": "m(∠BOC) = 180° – 50° = 130°;;OD is the bisector: x = 130° ÷ 2 = 65°", "f": "f163_4"}], "ch": 6}, {"n": 6, "title": "‘Parallel Lines and a Transversal’", "qs": [{"n": 1, "t": "d₁ ∥ d₂. What is x in degrees?", "o": {"A": "55°", "B": "60°", "C": "65°", "D": "115°"}, "a": "C", "s": "d₁ ∥ d₂: all acute angles are equal and all obtuse angles are equal.;;115° is obtuse and x is acute, so they are supplementary.;;x = 180° – 115° = 65°", "f": "f164_1"}, {"n": 2, "t": "d₁ ∥ d₂. Find x.", "o": {"A": "5", "B": "10", "C": "15", "D": "20"}, "a": "D", "s": "The marked angles are alternate interior angles, so they are equal.;;5x – 20° = 3x + 20°;;2x = 40° ⇒ x = 20", "f": "f164_2"}, {"n": 3, "t": "d₁ ∥ d₂. Find x.", "o": {"A": "25", "B": "30", "C": "35", "D": "40"}, "a": "A", "s": "The marked angles are co-interior angles, so they are supplementary.;;4x + (2x + 30°) = 180°;;6x = 150° ⇒ x = 25", "f": "f164_3"}, {"n": 4, "t": "d₁ ∥ d₂. What is y in degrees?", "o": {"A": "95°", "B": "105°", "C": "115°", "D": "125°"}, "a": "B", "s": "Alternate exterior angles are equal: 2x + 25° = 4x – 25° ⇒ x = 25;;So 2x + 25° = 75°.;;y and 75° are on a straight line: y = 180° – 75° = 105°", "f": "f164_4"}, {"n": 5, "t": "d₁ ∥ d₂ and a = 2y. What is y in degrees?", "o": {"A": "60°", "B": "65°", "C": "70°", "D": "90°"}, "a": "A", "s": "a is obtuse and y is acute, so a + y = 180°.;;2y + y = 180° ⇒ 3y = 180°;;y = 60°", "f": "f165_1"}, {"n": 6, "t": "d₁ ∥ d₂ and b – a = 40°. What is b in degrees?", "o": {"A": "90°", "B": "100°", "C": "110°", "D": "120°"}, "a": "C", "s": "a is acute and b is obtuse, so a + b = 180°.;;b – a = 40° and b + a = 180°;;2b = 220° ⇒ b = 110°", "f": "f165_2"}, {"n": 7, "t": "d₁ ∥ d₂. Find x.", "o": {"A": "15", "B": "20", "C": "25", "D": "30"}, "a": "B", "s": "The marked angles are corresponding angles, so they are equal.;;3x + 20° = 5x – 20°;;40° = 2x ⇒ x = 20", "f": "f165_3"}, {"n": 8, "t": "d₁ ∥ d₂. Find x.", "o": {"A": "15", "B": "20", "C": "25", "D": "30"}, "a": "D", "s": "The marked angles are co-interior angles, so they are supplementary.;;(3x + 20°) + (2x + 10°) = 180°;;5x + 30° = 180° ⇒ x = 30", "f": "f165_4"}], "ch": 6}, {"n": 7, "title": "‘Mixed Test 1’", "qs": [{"n": 1, "t": "The complement of an angle is 28°. What is the supplement of this angle?", "o": {"A": "88°", "B": "98°", "C": "108°", "D": "118°"}, "a": "D", "s": "The angle is 90° – 28° = 62°.;;Its supplement: 180° – 62° = 118°", "f": "f166_1"}, {"n": 2, "t": "Two intersecting lines are given. What is y in degrees?", "o": {"A": "80°", "B": "85°", "C": "90°", "D": "100°"}, "a": "A", "s": "Adjacent angles: 4x + (2x + 30°) = 180° ⇒ 6x = 150° ⇒ x = 25;;y and (2x + 30°) are vertical angles.;;y = 2 · 25° + 30° = 80°", "f": "f166_2"}, {"n": 3, "t": "The angles around point O are given. Find x.", "o": {"A": "26", "B": "30", "C": "34", "D": "38"}, "a": "C", "s": "Angles around a point, with one right angle:;;2x + 100° + 90° + 3x = 360°;;5x = 170° ⇒ x = 34", "f": "f166_3"}, {"n": 4, "t": "Ray OC is the bisector of ∠AOB and m(∠AOB) = 100°. Find x.", "o": {"A": "14", "B": "16", "C": "18", "D": "20"}, "a": "B", "s": "OC is the bisector, so m(∠AOC) = 100° ÷ 2 = 50°.;;3x + 2° = 50°;;3x = 48° ⇒ x = 16", "f": "f166_4"}, {"n": 5, "t": "d₁ ∥ d₂. Find x.", "o": {"A": "40", "B": "45", "C": "50", "D": "55"}, "a": "C", "s": "The marked angles are corresponding angles, so they are equal.;;2x + 15° = 115°;;2x = 100° ⇒ x = 50", "f": "f167_1"}, {"n": 6, "t": "A, O and B are collinear and OD ⊥ AB. What is m(∠AOC)?", "o": {"A": "100°", "B": "110°", "C": "120°", "D": "130°"}, "a": "D", "s": "OD ⊥ AB: (x + 15°) + 2x = 90° ⇒ 3x = 75° ⇒ x = 25;;m(∠DOC) = 25° + 15° = 40°;;m(∠AOC) = 90° + 40° = 130°", "f": "f167_2"}, {"n": 7, "t": "The two marked angles form a right angle. Find x.", "o": {"A": "4", "B": "9", "C": "14", "D": "19"}, "a": "C", "s": "The two angles form a right angle.;;4x + (2x + 6°) = 90°;;6x = 84° ⇒ x = 14", "f": "f167_3"}, {"n": 8, "t": "d₁ ∥ d₂. Find x.", "o": {"A": "25", "B": "30", "C": "35", "D": "40"}, "a": "A", "s": "The marked angles are alternate interior angles, so they are equal.;;4x = 2x + 50°;;2x = 50° ⇒ x = 25", "f": "f167_4"}], "ch": 6}, {"n": 8, "title": "‘Mixed Test 2’", "qs": [{"n": 1, "t": "The sum of the supplement and the complement of an angle is 200°. What is the measure of the angle?", "o": {"A": "30°", "B": "35°", "C": "40°", "D": "45°"}, "a": "B", "s": "Supplement: 180° – x; complement: 90° – x.;;(180° – x) + (90° – x) = 200°;;270° – 2x = 200° ⇒ 2x = 70° ⇒ x = 35°", "f": "f168_1"}, {"n": 2, "t": "Lines AB and CD intersect at O. Ray OE is the bisector of ∠BOD. If m(∠AOC) = 70°, what is m(∠AOE)?", "o": {"A": "125°", "B": "135°", "C": "145°", "D": "155°"}, "a": "C", "s": "Vertical angles: m(∠BOD) = m(∠AOC) = 70°.;;OE is the bisector: m(∠BOE) = 70° ÷ 2 = 35°;;m(∠AOE) = 180° – 35° = 145°", "f": "f168_2"}, {"n": 3, "t": "d₁ ∥ d₂. Find x.", "o": {"A": "30", "B": "35", "C": "40", "D": "45"}, "a": "A", "s": "The marked angles are co-interior angles, so they are supplementary.;;(3x + 20°) + (x + 40°) = 180°;;4x + 60° = 180° ⇒ x = 30", "f": "f168_3"}, {"n": 4, "t": "Three lines intersect at point O. Find x.", "o": {"A": "5", "B": "10", "C": "15", "D": "20"}, "a": "D", "s": "The vertical angle of 70° is between (x + 40°) and (2x + 10°).;;Straight line: (x + 40°) + 70° + (2x + 10°) = 180°;;3x + 120° = 180° ⇒ x = 20", "f": "f168_4"}, {"n": 5, "t": "OA ⊥ OB and ray OD is the bisector of ∠AOC. What is m(∠COB)?", "o": {"A": "18°", "B": "28°", "C": "38°", "D": "48°"}, "a": "D", "s": "OD is the bisector: m(∠AOD) = m(∠DOC) = x + 5°.;;OA ⊥ OB: 3x + 2(x + 5°) = 90° ⇒ 5x = 80° ⇒ x = 16;;m(∠COB) = 3x = 48°", "f": "f169_1"}, {"n": 6, "t": "d₁ ∥ d₂. What is y in degrees?", "o": {"A": "65°", "B": "70°", "C": "75°", "D": "110°"}, "a": "B", "s": "Both marked angles are obtuse, so they are equal.;;4x – 30° = 2x + 40° ⇒ x = 35 ⇒ the angle is 110°.;;y is acute: y = 180° – 110° = 70°", "f": "f169_2"}, {"n": 7, "t": "A, O and B are collinear and ray OD is the bisector of ∠AOC. What is x?", "o": {"A": "28°", "B": "38°", "C": "48°", "D": "58°"}, "a": "D", "s": "m(∠AOC) = 180° – 64° = 116°;;OD is the bisector: x = 116° ÷ 2 = 58°", "f": "f169_3"}, {"n": 8, "t": "Three angles are around point O. What is the measure of the biggest angle?", "o": {"A": "155°", "B": "160°", "C": "165°", "D": "170°"}, "a": "B", "s": "Angles around a point: 2x + 4x + 3x = 360°;;9x = 360° ⇒ x = 40°;;Biggest angle: 4x = 160°", "f": "f169_4"}], "ch": 6}, {"n": 9, "title": "‘Mixed Test 3’", "qs": [{"n": 1, "t": "Lines AB and CD intersect at O and OE ⊥ AB. Find x.", "o": {"A": "20", "B": "25", "C": "30", "D": "35"}, "a": "A", "s": "Vertical angles: m(∠AOC) = m(∠BOD) = x + 10°.;;OE ⊥ AB: (x + 10°) + 3x = 90°;;4x = 80° ⇒ x = 20", "f": "f170_1"}, {"n": 2, "t": "Ray OB is the bisector of ∠AOC. What is x in degrees?", "o": {"A": "45°", "B": "50°", "C": "55°", "D": "60°"}, "a": "D", "s": "Angles around O: m(∠AOC) = 360° – 110° – 130° = 120°;;OB is the bisector: x = 120° ÷ 2 = 60°", "f": "f170_2"}, {"n": 3, "t": "d₁ ∥ d₂. What is y in degrees?", "o": {"A": "65°", "B": "70°", "C": "75°", "D": "110°"}, "a": "B", "s": "Corresponding angles are equal: 6x – 10° = 4x + 30° ⇒ x = 20;;So the angle is 6 · 20° – 10° = 110°.;;y is on a straight line with it: y = 180° – 110° = 70°", "f": "f170_3"}, {"n": 4, "t": "The supplement of an angle is 30° less than 4 times its complement. What is the measure of the angle?", "o": {"A": "40°", "B": "45°", "C": "50°", "D": "55°"}, "a": "C", "s": "180° – x = 4(90° – x) – 30°;;180° – x = 330° – 4x;;3x = 150° ⇒ x = 50°", "f": "f170_4"}, {"n": 5, "t": "The angles formed by two intersecting lines are a, b, c and d. If a + c = 140°, what is b in degrees?", "o": {"A": "70°", "B": "110°", "C": "120°", "D": "130°"}, "a": "B", "s": "a and c are vertical angles: a = c = 140° ÷ 2 = 70°;;b is adjacent to a: b = 180° – 70° = 110°", "f": "f171_1"}, {"n": 6, "t": "A, O and B are collinear and ray OD is the bisector of ∠COB. What is m(∠AOD)?", "o": {"A": "140°", "B": "150°", "C": "160°", "D": "170°"}, "a": "A", "s": "OD is the bisector: m(∠COD) = m(∠DOB) = 2x – 10°.;;4x + 2(2x – 10°) = 180° ⇒ 8x = 200° ⇒ x = 25;;m(∠AOD) = 4x + (2x – 10°) = 100° + 40° = 140°", "f": "f171_2"}, {"n": 7, "t": "Two lines intersect. What is y in degrees?", "o": {"A": "120°", "B": "130°", "C": "140°", "D": "150°"}, "a": "A", "s": "Vertical angles: 3x = x + 40° ⇒ x = 20 ⇒ 3x = 60°;;y is adjacent: y = 180° – 60° = 120°", "f": "f171_3"}, {"n": 8, "t": "The supplement of an angle is 4 times its complement. What is the measure of the angle?", "o": {"A": "40°", "B": "50°", "C": "60°", "D": "70°"}, "a": "C", "s": "180° – x = 4(90° – x);;180° – x = 360° – 4x;;3x = 180° ⇒ x = 60°", "f": "f171_4"}], "ch": 6}, {"n": 10, "title": "‘Mixed Test 4’", "qs": [{"n": 1, "t": "Lines AB and CD intersect at point O. What is x in degrees?", "o": {"A": "20°", "B": "25°", "C": "30°", "D": "35°"}, "a": "C", "s": "Vertical angles: m(∠AOD) = m(∠COB) = 120°.;;∠AOD is made of x and 3x: x + 3x = 120°;;4x = 120° ⇒ x = 30°", "f": "f172_1"}, {"n": 2, "t": "One of two complementary angles is 15° more than 2 times the other. What is the smaller angle?", "o": {"A": "20°", "B": "25°", "C": "30°", "D": "35°"}, "a": "B", "s": "Let the smaller angle be a; the other is 2a + 15°.;;a + (2a + 15°) = 90°;;3a = 75° ⇒ a = 25°", "f": "f172_2"}, {"n": 3, "t": "d₁ ∥ d₂ and ray PE divides the marked angle into two equal parts. What is x in degrees?", "o": {"A": "25°", "B": "30°", "C": "35°", "D": "40°"}, "a": "D", "s": "The corresponding angle of 80° at P is also 80°.;;PE divides this angle into two equal parts.;;x = 80° ÷ 2 = 40°", "f": "f172_3"}, {"n": 4, "t": "A, O and B are collinear. What is the measure of the biggest angle?", "o": {"A": "72°", "B": "82°", "C": "92°", "D": "102°"}, "a": "A", "s": "Angles on a straight line: 4x + 3x + 2x + x = 180°;;10x = 180° ⇒ x = 18°;;Biggest angle: 4x = 72°", "f": "f172_4"}, {"n": 5, "t": "The obtuse angles formed by two intersecting lines add up to 250°. What is x in degrees?", "o": {"A": "55°", "B": "60°", "C": "65°", "D": "70°"}, "a": "A", "s": "The two obtuse angles are vertical angles, so they are equal: a = 250° ÷ 2 = 125°.;;x is adjacent to a: x = 180° – 125° = 55°", "f": "f173_1"}, {"n": 6, "t": "Lines AB and CD intersect at O and OE ⊥ CD. Find x.", "o": {"A": "20", "B": "24", "C": "28", "D": "32"}, "a": "C", "s": "OE ⊥ CD, so m(∠EOD) = 90°.;;(2x – 6°) + (x + 12°) = 90°;;3x + 6° = 90° ⇒ x = 28", "f": "f173_2"}, {"n": 7, "t": "d₁ ∥ d₂. Find x.", "o": {"A": "30", "B": "40", "C": "50", "D": "60"}, "a": "B", "s": "The marked angles are corresponding angles, so they are equal.;;2x + 30° = 110°;;2x = 80° ⇒ x = 40", "f": "f173_3"}, {"n": 8, "t": "Find x by using the angles around point O.", "o": {"A": "10", "B": "20", "C": "30", "D": "40"}, "a": "D", "s": "Angles around a point, with one right angle:;;90° + (x + 20°) + 2x + (3x + 10°) = 360°;;6x + 120° = 360° ⇒ x = 40", "f": "f173_4"}], "ch": 6}, {"n": 11, "title": "‘Mixed Test 5’", "qs": [{"n": 1, "t": "A, O and B are collinear; rays OD and OE are the bisectors of ∠BOC and ∠COA. What is m(∠BOC)?", "o": {"A": "55°", "B": "60°", "C": "65°", "D": "70°"}, "a": "D", "s": "The angle between the bisectors of adjacent supplementary angles is 90°.;;(2x + 5°) + (x + 10°) = 90° ⇒ 3x = 75° ⇒ x = 25;;m(∠DOC) = 35°, so m(∠BOC) = 2 · 35° = 70°", "f": "f174_1"}, {"n": 2, "t": "The angles around point O are given. Find x.", "o": {"A": "20", "B": "25", "C": "30", "D": "35"}, "a": "C", "s": "Angles around a point, with one right angle:;;100° + 90° + (2x + 20°) + 2x + x = 360°;;5x + 210° = 360° ⇒ x = 30", "f": "f174_2"}, {"n": 3, "t": "d₁ ∥ d₂. What is y in degrees?", "o": {"A": "110°", "B": "120°", "C": "130°", "D": "140°"}, "a": "B", "s": "Alternate interior angles are equal: 2x + 20° = 4x – 20° ⇒ x = 20;;So this angle is 60°.;;y is on a straight line with it: y = 180° – 60° = 120°", "f": "f174_3"}, {"n": 4, "t": "The ratio of the complement of an angle to its supplement is <span class=\"fr\"><span>2</span><span>5</span></span>. What is the measure of the angle?", "o": {"A": "30°", "B": "35°", "C": "40°", "D": "45°"}, "a": "A", "s": "[[90° – x;180° – x]] = [[2;5]];;5(90° – x) = 2(180° – x);;450° – 5x = 360° – 2x ⇒ 3x = 90° ⇒ x = 30°", "f": "f174_4"}, {"n": 5, "t": "Lines AB and CD intersect at O. Ray OE is the bisector of ∠AOC. What is m(∠EOB)?", "o": {"A": "128°", "B": "138°", "C": "148°", "D": "158°"}, "a": "B", "s": "Vertical angles: m(∠AOC) = m(∠BOD) = 84°.;;OE is the bisector: m(∠AOE) = 84° ÷ 2 = 42°;;m(∠EOB) = 180° – 42° = 138°", "f": "f175_1"}, {"n": 6, "t": "OA ⊥ OD. What is m(∠AOC)?", "o": {"A": "40°", "B": "45°", "C": "50°", "D": "55°"}, "a": "D", "s": "OA ⊥ OD: (3x – 10°) + 2x + (x + 10°) = 90°;;6x = 90° ⇒ x = 15;;m(∠AOC) = 2x + (x + 10°) = 30° + 25° = 55°", "f": "f175_2"}, {"n": 7, "t": "A, O and B are collinear and OC ⊥ OD. What is x?", "o": {"A": "35°", "B": "45°", "C": "55°", "D": "65°"}, "a": "C", "s": "Straight line: 35° + 90° + x = 180°;;x = 180° – 125° = 55°", "f": "f175_3"}, {"n": 8, "t": "Three lines intersect at point O. Find x.", "o": {"A": "30", "B": "35", "C": "40", "D": "45"}, "a": "A", "s": "The angles on one side of the line add up to 180°.;;(x + 40°) + 50° + 2x = 180°;;3x + 90° = 180° ⇒ x = 30", "f": "f175_4"}], "ch": 6}, {"n": 12, "title": "‘Mixed Test 6’", "qs": [{"n": 1, "t": "d₁ ∥ d₂. Find x.", "o": {"A": "15", "B": "20", "C": "25", "D": "30"}, "a": "B", "s": "The marked angles are co-interior angles, so they are supplementary.;;5x + 4x = 180°;;9x = 180° ⇒ x = 20", "f": "f176_1"}, {"n": 2, "t": "Three lines intersect at O and x = 2y. What is x in degrees?", "o": {"A": "80°", "B": "85°", "C": "90°", "D": "100°"}, "a": "A", "s": "The angles on one side of the lines add up to 180°: 60° + y + x = 180°.;;x = 2y: 60° + 3y = 180° ⇒ y = 40°;;x = 2 · 40° = 80°", "f": "f176_2"}, {"n": 3, "t": "Ray OC is the bisector of ∠AOB and ray OD is the bisector of ∠COB. If m(∠AOD) = 99°, what is m(∠AOB)?", "o": {"A": "112°", "B": "122°", "C": "132°", "D": "142°"}, "a": "C", "s": "m(∠AOC) = m(∠COB) and OD cuts ∠COB into two equal parts.;;Let m(∠COD) = k. Then m(∠COB) = 2k and m(∠AOC) = 2k.;;m(∠AOD) = 2k + k = 3k = 99° ⇒ k = 33°;;m(∠AOB) = 4k = 132°", "f": "f176_3"}, {"n": 4, "t": "Half of the supplement of an angle x plus its complement is 120°. What is x in degrees?", "o": {"A": "25°", "B": "30°", "C": "35°", "D": "40°"}, "a": "D", "s": "[[180° – x;2]] + (90° – x) = 120°;;90° – [[x;2]] + 90° – x = 120°;;[[3x;2]] = 60° ⇒ x = 40°", "f": "f176_4"}, {"n": 5, "t": "d₁ ∥ d₂ and ray QR divides the marked angle into two equal parts. What is x in degrees?", "o": {"A": "25°", "B": "30°", "C": "35°", "D": "55°"}, "a": "C", "s": "The acute angle at P is 180° – 110° = 70°.;;The marked angle at Q is its corresponding angle: 70°.;;QR divides it into two equal parts: x = 70° ÷ 2 = 35°", "f": "f177_1"}, {"n": 6, "t": "The angles around point O are given. Find x.", "o": {"A": "20", "B": "25", "C": "30", "D": "35"}, "a": "B", "s": "Angles around a point, with one right angle:;;90° + (2x + 10°) + 4x + (3x + 35°) = 360°;;9x + 135° = 360° ⇒ 9x = 225° ⇒ x = 25", "f": "f177_2"}, {"n": 7, "t": "d₁ ∥ d₂. What is the measure of the bigger marked angle?", "o": {"A": "105°", "B": "115°", "C": "125°", "D": "135°"}, "a": "D", "s": "3x is obtuse and x is acute, so they are supplementary.;;3x + x = 180° ⇒ x = 45°;;Bigger angle: 3x = 135°", "f": "f177_3"}, {"n": 8, "t": "Lines AB and CD intersect at O and OE ⊥ AB. What is x?", "o": {"A": "45°", "B": "55°", "C": "65°", "D": "75°"}, "a": "B", "s": "OE ⊥ AB: m(∠AOC) = 90° – 35° = 55°.;;x and ∠AOC are vertical angles.;;x = 55°", "f": "f177_4"}], "ch": 6}, {"n": 13, "title": "‘Challenge Test 1’", "qs": [{"n": 1, "t": "Lines AB and CD intersect at O and ray OE is the bisector of ∠BOD. What is m(∠AOE)?", "o": {"A": "110°", "B": "120°", "C": "130°", "D": "140°"}, "a": "C", "s": "m(∠AOC) = 2x + 20°, so m(∠AOD) = 180° – (2x + 20°) = 160° – 2x.;;Vertical angles: m(∠BOD) = 2x + 20°, so m(∠DOE) = x + 10°.;;m(∠AOE) = (160° – 2x) + (x + 10°) = 3x + 10° ⇒ 170° – x = 3x + 10° ⇒ x = 40;;m(∠AOE) = 3 · 40° + 10° = 130°", "f": "f178_1"}, {"n": 2, "t": "The ratio of the complement of an angle to its supplement is 1 : 4. What is the supplement of half of this angle?", "o": {"A": "150°", "B": "140°", "C": "130°", "D": "120°"}, "a": "A", "s": "[[90° – x;180° – x]] = [[1;4]] ⇒ 4(90° – x) = 180° – x;;360° – 4x = 180° – x ⇒ 3x = 180° ⇒ x = 60°;;Half of the angle: 30°. Its supplement: 180° – 30° = 150°", "f": "f178_2"}, {"n": 3, "t": "d₁ ∥ d₂. Find x.", "o": {"A": "65°", "B": "75°", "C": "85°", "D": "105°"}, "a": "B", "s": "Draw a line through the corner, parallel to d₁ and d₂.;;Alternate interior angles: 40° and 35°.;;x = 40° + 35° = 75°", "f": "f178_3"}, {"n": 4, "t": "d₁ ∥ d₂. The bisectors of the two marked interior angles meet at point P. What is x?", "o": {"A": "80°", "B": "85°", "C": "95°", "D": "90°"}, "a": "D", "s": "The two marked interior angles are co-interior: they add up to 180°.;;Their halves add up to 90°.;;Triangle APB: x = 180° – 90° = 90°", "f": "f178_4"}, {"n": 5, "t": "Lines AB and CD intersect at O and OE ⊥ AB. What is m(∠AOD)?", "o": {"A": "120°", "B": "110°", "C": "100°", "D": "130°"}, "a": "A", "s": "OE ⊥ AB: m(∠AOC) = 90° – 2x.;;Vertical angles: 90° – 2x = 3x + 15° ⇒ 5x = 75° ⇒ x = 15;;m(∠BOD) = 60°, so m(∠AOD) = 180° – 60° = 120°", "f": "f179_1"}, {"n": 6, "t": "A, O and B are collinear and OC ⊥ OD. Rays OE and OF are the bisectors of ∠AOC and ∠DOB. What is x?", "o": {"A": "120°", "B": "125°", "C": "135°", "D": "145°"}, "a": "C", "s": "Straight line: m(∠AOC) + m(∠DOB) = 180° – 90° = 90°;;The bisectors take half of each: 90° ÷ 2 = 45°;;x = 45° + 90° = 135°", "f": "f179_2"}, {"n": 7, "t": "d₁ ∥ d₂. Lines k and m meet at point P on d₁. What is x?", "o": {"A": "55°", "B": "60°", "C": "70°", "D": "65°"}, "a": "D", "s": "Alternate interior angles at P: 65° and 50°.;;Straight angle at P: 65° + x + 50° = 180°;;x = 65°", "f": "f179_3"}, {"n": 8, "t": "Three lines intersect at point O. What is the measure of the biggest angle in the figure?", "o": {"A": "60°", "B": "70°", "C": "80°", "D": "90°"}, "a": "B", "s": "The angles on one side of the lines add up to 180°.;;2x + (x + 20°) + (3x – 20°) = 180° ⇒ 6x = 180° ⇒ x = 30;;The angles are 60°, 50° and 70°. Biggest: 70°", "f": "f179_4"}], "ch": 6}, {"n": 14, "title": "‘Challenge Test 2’", "qs": [{"n": 1, "t": "d₁ ∥ d₂. Find x.", "o": {"A": "65°", "B": "70°", "C": "75°", "D": "85°"}, "a": "C", "s": "Draw lines through the two corners, parallel to d₁ and d₂.;;The angles that open to the right equal the angles that open to the left:;;30° + 70° = x + 25°;;x = 75°", "f": "f180_1"}, {"n": 2, "t": "A, O and C are collinear. Ray OD is the bisector of ∠AOB and ray OE is the bisector of ∠BOC. What is m(∠BOE)?", "o": {"A": "48°", "B": "42°", "C": "46°", "D": "52°"}, "a": "A", "s": "OD and OE are bisectors: m(∠AOB) = 2(2x + 10°) and m(∠BOC) = 2 · 3x.;;Straight line: 4x + 20° + 6x = 180° ⇒ 10x = 160° ⇒ x = 16;;m(∠BOE) = 3x = 48°", "f": "f180_2"}, {"n": 3, "t": "d₁ ∥ d₂ and k ∥ m. Find x.", "o": {"A": "15", "B": "20", "C": "25", "D": "30"}, "a": "B", "s": "d₁ ∥ d₂ and k ∥ m, so the two marked angles are equal.;;3x + 15° = 5x – 25°;;40° = 2x ⇒ x = 20", "f": "f180_3"}, {"n": 4, "t": "Ray OB is the bisector of ∠AOC. What is m(∠COD)?", "o": {"A": "100°", "B": "110°", "C": "130°", "D": "120°"}, "a": "D", "s": "OB is the bisector: m(∠AOB) = m(∠BOC) = x + 25°.;;Around O: 2(x + 25°) + 3x + (2x + 30°) = 360°;;7x + 80° = 360° ⇒ x = 40;;m(∠COD) = 3x = 120°", "f": "f180_4"}, {"n": 5, "t": "Lines AB and CD intersect at O. Rays OE and OF are the bisectors of ∠AOC and ∠BOC. What is m(∠BOD)?", "o": {"A": "60°", "B": "70°", "C": "80°", "D": "110°"}, "a": "B", "s": "m(∠AOC) = 2(2x + 5°) and m(∠COB) = 2(3x + 10°).;;Straight line: 4x + 10° + 6x + 20° = 180° ⇒ x = 15;;m(∠AOC) = 70°. ∠BOD and ∠AOC are vertical angles: m(∠BOD) = 70°", "f": "f181_1"}, {"n": 6, "t": "The supplement of the complement of an angle is 4 times the angle. What is the supplement of twice this angle?", "o": {"A": "100°", "B": "110°", "C": "120°", "D": "130°"}, "a": "C", "s": "Complement: 90° – x. Its supplement: 180° – (90° – x) = 90° + x.;;90° + x = 4x ⇒ 3x = 90° ⇒ x = 30°;;Twice the angle: 60°. Its supplement: 180° – 60° = 120°", "f": "f181_2"}, {"n": 7, "t": "d₁ ∥ d₂. The ray from A divides the marked 110° angle into two equal parts and meets d₂ at C. What is x?", "o": {"A": "55°", "B": "45°", "C": "65°", "D": "70°"}, "a": "A", "s": "The ray divides 110° into two equal parts: 55° and 55°.;;x and 55° are alternate interior angles.;;x = 55°", "f": "f181_3"}, {"n": 8, "t": "d₁ ∥ d₂ ∥ d₃. What is y in degrees?", "o": {"A": "70°", "B": "100°", "C": "120°", "D": "110°"}, "a": "D", "s": "The marked angles at d₁ and d₃ are both acute, so they are equal.;;3x + 10° = 5x – 30° ⇒ x = 20 ⇒ the acute angle is 70°.;;y is obtuse: y = 180° – 70° = 110°", "f": "f181_4"}], "ch": 6}], "7": [{"n": 1, "title": "‘Interior Angles of a Triangle’", "qs": [{"n": 1, "t": "In triangle ABC, m(∠B) = 48° and m(∠C) = 57°. What is x in degrees?", "o": {"A": "75°", "B": "80°", "C": "85°", "D": "95°"}, "a": "A", "s": "The interior angles of a triangle add up to 180°.;;x + 48° + 57° = 180°;;x = 180° – 105° = 75°", "f": "f200_1"}, {"n": 2, "t": "Find x in triangle ABC.", "o": {"A": "20", "B": "25", "C": "30", "D": "35"}, "a": "C", "s": "(2x + 20°) + (x + 15°) + (3x – 35°) = 180°;;6x = 180°;;x = 30", "f": "f200_2"}, {"n": 3, "t": "In triangle ABC, m(∠A) = 2 · m(∠B) and m(∠C) = 60°. What is m(∠A)?", "o": {"A": "60°", "B": "70°", "C": "75°", "D": "80°"}, "a": "D", "s": "m(∠B) = a and m(∠A) = 2a.;;2a + a + 60° = 180° ⇒ 3a = 120° ⇒ a = 40°;;m(∠A) = 2a = 80°", "f": "f200_3"}, {"n": 4, "t": "The interior angles of a triangle are proportional to 2, 3 and 7. What is the measure of the biggest angle?", "o": {"A": "95°", "B": "105°", "C": "115°", "D": "125°"}, "a": "B", "s": "2k + 3k + 7k = 180° ⇒ 12k = 180° ⇒ k = 15°;;Biggest angle: 7k = 105°", "f": "f200_4"}, {"n": 5, "t": "In triangle ABC, D ∈ [BC]. According to the figure, what is m(∠ACB)?", "o": {"A": "50°", "B": "55°", "C": "60°", "D": "65°"}, "a": "C", "s": "m(∠BAC) = 30° + 40° = 70°;;m(∠ACB) = 180° – 50° – 70° = 60°", "f": "f201_1"}, {"n": 6, "t": "In triangle ABC, m(∠A) – m(∠B) = 20° and m(∠C) = 70°. What is m(∠A)?", "o": {"A": "65°", "B": "70°", "C": "75°", "D": "80°"}, "a": "A", "s": "a + b = 180° – 70° = 110° and a – b = 20°.;;2a = 130° ⇒ a = 65°", "f": "f201_2"}, {"n": 7, "t": "Find x in triangle ABC.", "o": {"A": "55°", "B": "65°", "C": "75°", "D": "85°"}, "a": "A", "s": "x + 50° + 75° = 180°;;x = 180° – 125° = 55°", "f": "f201_3"}, {"n": 8, "t": "What is the measure of the biggest angle of triangle ABC?", "o": {"A": "60°", "B": "70°", "C": "80°", "D": "90°"}, "a": "C", "s": "(3x – 10°) + 2x + (x + 10°) = 180° ⇒ 6x = 180° ⇒ x = 30;;The angles are 80°, 60° and 40°. Biggest: 80°", "f": "f201_4"}], "ch": 7}, {"n": 2, "title": "‘The Exterior Angle of a Triangle’", "qs": [{"n": 1, "t": "B, C and D are collinear. What is x in degrees?", "o": {"A": "85°", "B": "95°", "C": "105°", "D": "115°"}, "a": "D", "s": "An exterior angle equals the sum of the two interior angles that are not next to it.;;x = 48° + 67° = 115°", "f": "f202_1"}, {"n": 2, "t": "B, C and D are collinear. What is x in degrees?", "o": {"A": "50°", "B": "55°", "C": "60°", "D": "65°"}, "a": "B", "s": "Exterior angle: 125° = 70° + x;;x = 55°", "f": "f202_2"}, {"n": 3, "t": "B, C and D are collinear. Find x.", "o": {"A": "20", "B": "25", "C": "30", "D": "35"}, "a": "A", "s": "Exterior angle: 4x = (x + 30°) + (2x – 10°);;4x = 3x + 20°;;x = 20", "f": "f202_3"}, {"n": 4, "t": "D, B and C are collinear. What is x in degrees?", "o": {"A": "95°", "B": "105°", "C": "115°", "D": "125°"}, "a": "C", "s": "x is the exterior angle at B.;;x = 40° + 75° = 115°", "f": "f202_4"}, {"n": 5, "t": "B, C and D are collinear and m(∠ACD) = 2 · m(∠BAC). What is x in degrees?", "o": {"A": "35°", "B": "40°", "C": "45°", "D": "50°"}, "a": "D", "s": "Exterior angle: 2x = x + 50°;;x = 50°", "f": "f203_1"}, {"n": 6, "t": "E, B, C and D are collinear. What is x in degrees according to the exterior angles?", "o": {"A": "60°", "B": "65°", "C": "70°", "D": "75°"}, "a": "B", "s": "Interior angle at B: 180° – 130° = 50°.;;Interior angle at C: 180° – 115° = 65°.;;x = 180° – 50° – 65° = 65°", "f": "f203_2"}, {"n": 7, "t": "B, C and D are collinear. What is x in degrees?", "o": {"A": "55°", "B": "65°", "C": "75°", "D": "85°"}, "a": "B", "s": "Exterior angle: 110° = 45° + x;;x = 65°", "f": "f203_3"}, {"n": 8, "t": "B, C and D are collinear. Find x.", "o": {"A": "20", "B": "30", "C": "40", "D": "50"}, "a": "D", "s": "Exterior angle: 3x = (x + 20°) + (x + 30°);;3x = 2x + 50°;;x = 50", "f": "f203_4"}], "ch": 7}, {"n": 3, "title": "‘The Sum of the Exterior Angles’", "qs": [{"n": 1, "t": "The exterior angles of triangle ABC are given. What is x in degrees?", "o": {"A": "110°", "B": "120°", "C": "130°", "D": "140°"}, "a": "C", "s": "The exterior angles add up to 360°.;;125° + 105° + x = 360°;;x = 130°", "f": "f204_1"}, {"n": 2, "t": "Find x by using the exterior angles in the figure.", "o": {"A": "40", "B": "45", "C": "50", "D": "55"}, "a": "A", "s": "(2x + 20°) + 3x + (4x – 20°) = 360°;;9x = 360°;;x = 40", "f": "f204_2"}, {"n": 3, "t": "The exterior angles of a triangle are proportional to 3, 4 and 5. What is the smallest interior angle of this triangle?", "o": {"A": "25°", "B": "30°", "C": "35°", "D": "90°"}, "a": "B", "s": "3k + 4k + 5k = 360° ⇒ 12k = 360° ⇒ k = 30°;;The biggest exterior angle is 5k = 150°.;;The smallest interior angle is next to it: 180° – 150° = 30°", "f": "f204_3"}, {"n": 4, "t": "The exterior angles at A and B are 120° and 140°. What is m(∠C)?", "o": {"A": "60°", "B": "70°", "C": "75°", "D": "80°"}, "a": "D", "s": "Exterior angle at C: 360° – 120° – 140° = 100°.;;m(∠C) = 180° – 100° = 80°", "f": "f204_4"}, {"n": 5, "t": "The exterior angles at A and B are equal. If the exterior angle at C is 100°, what is x in degrees?", "o": {"A": "130°", "B": "140°", "C": "150°", "D": "160°"}, "a": "A", "s": "The exterior angles at A and B are both x.;;x + x + 100° = 360° ⇒ 2x = 260°;;x = 130°", "f": "f205_1"}, {"n": 6, "t": "In the figure, m(∠A) = x. Find x in degrees by using the given angles.", "o": {"A": "20°", "B": "25°", "C": "30°", "D": "35°"}, "a": "C", "s": "Exterior angle at A: 180° – x.;;(180° – x) + 120° + (2x + 30°) = 360°;;x + 330° = 360° ⇒ x = 30°", "f": "f205_2"}, {"n": 7, "t": "The exterior angles of triangle ABC are given. Find x.", "o": {"A": "20", "B": "30", "C": "40", "D": "50"}, "a": "C", "s": "3x + 2x + 4x = 360°;;9x = 360°;;x = 40", "f": "f205_3"}, {"n": 8, "t": "The exterior angles at A and B are 130° and 110°. What is m(∠C)?", "o": {"A": "60°", "B": "70°", "C": "80°", "D": "90°"}, "a": "A", "s": "Exterior angle at C: 360° – 130° – 110° = 120°.;;m(∠C) = 180° – 120° = 60°", "f": "f205_4"}], "ch": 7}, {"n": 4, "title": "‘Angles in a Right Triangle’", "qs": [{"n": 1, "t": "In triangle ABC, m(∠C) = 90° and m(∠A) = 58°. What is x in degrees?", "o": {"A": "28°", "B": "32°", "C": "36°", "D": "40°"}, "a": "B", "s": "The acute angles of a right triangle are complementary.;;x + 58° = 90°;;x = 32°", "f": "f206_1"}, {"n": 2, "t": "AB ⊥ BC. Find x.", "o": {"A": "5", "B": "10", "C": "15", "D": "20"}, "a": "D", "s": "AB ⊥ BC, so the acute angles add up to 90°.;;(x + 30°) + 2x = 90°;;3x = 60° ⇒ x = 20", "f": "f206_2"}, {"n": 3, "t": "The difference between the acute angles of a right triangle is 30°. What is the bigger acute angle?", "o": {"A": "50°", "B": "55°", "C": "60°", "D": "65°"}, "a": "C", "s": "a + b = 90° and a – b = 30°.;;2a = 120° ⇒ a = 60°", "f": "f206_3"}, {"n": 4, "t": "m(∠BAC) = 90°, AD ⊥ BC and m(∠BAD) = 52°. What is x in degrees?", "o": {"A": "38°", "B": "42°", "C": "46°", "D": "52°"}, "a": "A", "s": "Triangle ABD is a right triangle (AD ⊥ BC).;;x + 52° = 90°;;x = 38°", "f": "f206_4"}, {"n": 5, "t": "m(∠C) = 90° and D, B, C are collinear. What is x in degrees?", "o": {"A": "35°", "B": "40°", "C": "45°", "D": "50°"}, "a": "B", "s": "m(∠ABC) = 180° – 130° = 50°.;;Right triangle: x + 50° = 90°;;x = 40°", "f": "f207_1"}, {"n": 6, "t": "AB ⊥ BC, D ∈ [BC] and m(∠BAD) = 25°. What is x in degrees?", "o": {"A": "85°", "B": "95°", "C": "105°", "D": "115°"}, "a": "D", "s": "Triangle ABD: m(∠ADB) = 90° – 25° = 65°.;;x and ∠ADB are on a straight line.;;x = 180° – 65° = 115°", "f": "f207_2"}, {"n": 7, "t": "m(∠BAC) = 90°. Find x.", "o": {"A": "5", "B": "10", "C": "15", "D": "20"}, "a": "D", "s": "m(∠BAC) = 90°, so the other two angles add up to 90°.;;(2x + 5°) + (x + 25°) = 90°;;3x = 60° ⇒ x = 20", "f": "f207_3"}, {"n": 8, "t": "m(∠C) = 90° and E, B, C are collinear. What is m(∠A)?", "o": {"A": "40°", "B": "50°", "C": "60°", "D": "70°"}, "a": "B", "s": "m(∠ABC) = 180° – 140° = 40°.;;m(∠A) = 90° – 40° = 50°", "f": "f207_4"}], "ch": 7}, {"n": 5, "title": "‘Angles in an Isosceles Triangle’", "qs": [{"n": 1, "t": "|AB| = |AC| and m(∠A) = 36°. What is x in degrees?", "o": {"A": "72°", "B": "82°", "C": "92°", "D": "144°"}, "a": "A", "s": "| x – 20° = 60°;;4x = 80° ⇒ x = 20", "f": "f210_1"}, {"n": 2, "t": "ABC is an equilateral triangle and D ∈ [BC]. What is x in degrees?", "o": {"A": "20°", "B": "25°", "C": "30°", "D": "35°"}, "a": "D", "s": "m(∠ADC) = 95° is an exterior angle of triangle ABD.;;95° = m(∠B) + x = 60° + x;;x = 35°", "f": "f210_2"}, {"n": 3, "t": "ABC is an equilateral triangle. What is the sum of the exterior angles at the vertices B and C?", "o": {"A": "240°", "B": "250°", "C": "260°", "D": "270°"}, "a": "A", "s": "Each exterior angle of an equilateral triangle is 180° – 60° = 120°.;;x + y = 120° + 120° = 240°", "f": "f210_3"}, {"n": 4, "t": "ABC is an equilateral triangle, D ∈ [AC] and m(∠ABD) = 25°. What is x in degrees?", "o": {"A": "80°", "B": "85°", "C": "90°", "D": "105°"}, "a": "B", "s": "x is an exterior angle of triangle ABD.;;x = m(∠A) + m(∠ABD) = 60° + 25°;;x = 85°", "f": "f210_4"}, {"n": 5, "t": "ABC is an equilateral triangle, B, C, D are collinear and |CD| = |CA|. What is m(∠BAD)?", "o": {"A": "90°", "B": "95°", "C": "100°", "D": "105°"}, "a": "A", "s": "m(∠ACD) = 180° – 60° = 120°.;;|CD| = |CA|: triangle ACD is isosceles, m(∠CAD) = (180° – 120°) ÷ 2 = 30°.;;m(∠BAD) = 60° + 30° = 90°", "f": "f211_1"}, {"n": 6, "t": "ABC is an equilateral triangle and AD ⊥ BC. What is x in degrees?", "o": {"A": "20°", "B": "25°", "C": "30°", "D": "60°"}, "a": "C", "s": "Triangle ABD: m(∠B) = 60° and m(∠ADB) = 90°.;;x = 180° – 60° – 90° = 30°", "f": "f211_2"}, {"n": 7, "t": "ABC is an equilateral triangle and B, C, D are collinear. Find x.", "o": {"A": "30", "B": "40", "C": "50", "D": "60"}, "a": "B", "s": "Each exterior angle of an equilateral triangle is 120°.;;2x + 40° = 120°;;2x = 80° ⇒ x = 40", "f": "f211_3"}, {"n": 8, "t": "ABC is an equilateral triangle, D ∈ [BC] and m(∠BAD) = 15°. What is x?", "o": {"A": "45°", "B": "55°", "C": "65°", "D": "75°"}, "a": "D", "s": "x is an exterior angle of triangle ABD.;;x = m(∠B) + m(∠BAD) = 60° + 15°;;x = 75°", "f": "f211_4"}], "ch": 7}, {"n": 7, "t  m(∠B) in triangle ABC?", "o": {"A": "65°", "B": "70°", "C": "75°", "D": "80°"}, "a": "A", "s": "3x + (2x + 15°) + (x + 15°) = 180°;;6x + 30° = 180° ⇒ x = 25;;m(∠B) = 2 · 25° + 15° = 65°", "f": "f216_1"}, {"n": 2, "t": "B, C and D are collinear and m(∠ACD) = 2 · m(∠B). If m(∠A) = 55°, what is x in degrees?", "o": {"A": "80°", "B": "90°", "C": "100°", "D": "110°"}, "a": "D", "s": "Exterior angle: x = 55° + b, and x = 2b.;;2b = 55° + b ⇒ b = 55°;;x = 2 · 55° = 110°", "f": "f216_2"}, {"n": 3, "t": "AB ⊥ BC and B, C, D are collinear. Find x.", "o": {"A": "20", "B": "25", "C": "30", "D": "35"}, "a": "B", "s": "5x is the exterior angle at C.;;5x = 90° + 35° = 125°;;x = 25", "f": "f216_3"}, {"n": 4, "t": "|AB| = |AC| and the vertex angle is 30° bigger than a base angle. What is m(∠A)?", "o": {"A": "70°", "B": "75°", "C": "80°", "D": "100°"}, "a": "C", "s": "m(∠B) = m(∠C) = a and m(∠A) = a + 30°.;;(a + 30°) + 2a = 180° ⇒ 3a = 150° ⇒ a = 50°;;m(∠A) = 80°", "f": "f216_4"}, {"n": 5, "t": "m(∠A) = 70°. Find x by using the exterior angles.", "o": {"A": "45", "B": "50", "C": "55", "D": "60"}, "a": "B", "s": "Exterior angle at A: 180° – 70° = 110°.;;110° + 2x + 3x = 360°;;5x = 250° ⇒ x = 50", "f": "f217_1"}, {"n": 6, "t": "ABC is an equilateral triangle and B, C, D are collinear. Find x.", "o": {"A": "25", "B": "30", "C": "35", "D": "40"}, "a": "A", "s": "Each exterior angle of an equilateral triangle is 120°.;;5x – 5° = 120°;;5x = 125° ⇒ x = 25", "f": "f217_2"}, {"n": 7, "t": "m(∠BAC) = 90° and AD ⊥ BC. What is x?", "o": {"A": "30°", "B": "35°", "C": "40°", "D": "45°"}, "a": "A", "s": "Triangle ABD: m(∠B) = 90° – 30° = 60°.;;Triangle ABC: x = 90° – 60°;;x = 30°", "f": "f217_3"}, {"n": 8, "t": "The exterior angles of triangle ABC are given. What is the measure of the biggest exterior angle?", "o": {"A": "140°", "B": "150°", "C": "160°", "D": "170°"}, "a": "C", "s": "(x + 20°) + 2x + (3x – 20°) = 360° ⇒ 6x = 360° ⇒ x = 60;;The exterior angles are 80°, 120° and 160°. Biggest: 160°", "f": "f217_4"}], "ch": 7}, {"n": 10, "title": "‘Mixed Test 4’", "qs": [{"n": 1, "t": "D ∈ [BC]. What is x in degrees?", "o": {"A": "70°", "B": "75°", "C": "80°", "D": "85°"}, "a": "C", "s": "x is an exterior angle of triangle ABD.;;x = 45° + 35°;;x = 80°", "f": "f218_1"}, {"n": 2, "t": "In triangle ABC, m(∠A) = 105° and m(∠B) = 2 · m(∠C). What is m(∠B)?", "o": {"A": "45°", "B": "50°", "C": "55°", "D": "60°"}, "a": "B", "s": "m(∠C) = c and m(∠B) = 2c.;;105° + 2c + c = 180° ⇒ 3c = 75° ⇒ c = 25°;;m(∠B) = 50°", "f": "f218_2"}, {"n": 3, "t": "AB ⊥ BC. Find x.", "o": {"A": "5", "B": "10", "C": "15", "D": "20"}, "a": "C", "s": "AB ⊥ BC, so the acute angles are complementary.;;(4x – 10°) + (2x + 10°) = 90°;;6x = 90° ⇒ x = 15", "f": "f218_3"}, {"n": 4, "t": "The exterior angle at A is 110°. The exterior angle at B is 30° bigger than the exterior angle at C. What is x in degrees?", "o": {"A": "140°", "B": "150°", "C": "160°", "D": "170°"}, "a": "A", "s": "The exterior angles at B and C add up to 360° – 110° = 250°.;;Let the exterior angle at C be y: y + (y + 30°) = 250° ⇒ y = 110°;;x = 110° + 30° = 140°", "f": "f218_4"}, {"n": 5, "t": "|AB| = |AC|. Find x.", "o": {"A": "40", "B": "45", "C": "50", "D": "55"}, "a": "A", "s": "The base angles are both x + 30°.;;x + 2(x + 30°) = 180°;;3x = 120° ⇒ x = 40", "f": "f219_1"}, {"n": 6, "t": "ABC is an equilateral triangle, D ∈ [BC] and m(∠ADB) = 100°. What is x in degrees?", "o": {"A": "30°", "B": "35°", "C": "40°", "D": "45°"}, "a": "C", "s": "m(∠ADC) = 180° – 100° = 80°.;;Triangle ADC: x = 180° – 80° – 60°;;x = 40°", "f": "f219_2"}, {"n": 7, "t": "|AB| = |AC| and B, C, D are collinear. What is x?", "o": {"A": "40°", "B": "50°", "C": "60°", "D": "70°"}, "a": "B", "s": "m(∠ACB) = 180° – 115° = 65° = m(∠B).;;x = 180° – 65° – 65°;;x = 50°", "f": "f219_3"}, {"n": 8, "t": "What is the measure of the biggest angle of triangle ABC?", "o": {"A": "60°", "B": "70°", "C": "80°", "D": "90°"}, "a": "D", "s": "x + 2x + 3x = 180° ⇒ 6x = 180° ⇒ x = 30°;;Biggest angle: 3x = 90°", "f": "f219_4"}], "ch": 7}, {"n": 11, "title": "‘Mixed Test 5’", "qs": [{"n": 1, "t": "In triangle ABC, m(∠A) = m(∠B) + m(∠C) and m(∠B) = 35°. What is x in degrees?", "o": {"A": "40°", "B": "45°", "C": "50°", "D": "55°"}, "a": "D", "s": "m(∠A) + m(∠B) + m(∠C) = 180° and m(∠A) = m(∠B) + m(∠C).;;2 · m(∠A) = 180° ⇒ m(∠A) = 90°;;x = 90° – 35° = 55°", "f": "f220_1"}, {"n": 2, "t": "B, C and D are collinear. Find x.", "o": {"A": "20", "B": "25", "C": "30", "D": "35"}, "a": "C", "s": "Exterior angle at C: 4x + 20° = (2x + 20°) + (x + 30°);;4x + 20° = 3x + 50°;;x = 30", "f": "f220_2"}, {"n": 3, "t": "m(∠BAC) = 90° and AD ⊥ BC. Find x.", "o": {"A": "20", "B": "25", "C": "30", "D": "35"}, "a": "B", "s": "Triangle ADC: m(∠DAC) = 90° – 60° = 30°.;;m(∠BAD) = 90° – 30° = 60°;;2x + 10° = 60° ⇒ x = 25", "f": "f220_3"}, {"n": 4, "t": "|CA| = |CB| and m(∠C) = 40°. What is x in degrees?", "o": {"A": "70°", "B": "75°", "C": "80°", "D": "85°"}, "a": "A", "s": "|CA| = |CB|, so m(∠A) = m(∠B) = x.;;x + x + 40° = 180°;;x = 70°", "f": "f220_4"}, {"n": 5, "t": "Find x by using the exterior angles in the figure.", "o": {"A": "40", "B": "45", "C": "50", "D": "55"}, "a": "B", "s": "The exterior angles add up to 360°.;;(x + 40°) + (2x + 30°) + (3x + 20°) = 360°;;6x + 90° = 360° ⇒ x = 45", "f": "f221_1"}, {"n": 6, "t": "ABC is an equilateral triangle, D ∈ [BC] and m(∠BAD) = x + 5°. Find x.", "o": {"A": "5", "B": "10", "C": "15", "D": "20"}, "a": "D", "s": "3x + 25° is an exterior angle of triangle ABD.;;3x + 25° = 60° + (x + 5°);;2x = 40° ⇒ x = 20", "f": "f221_2"}, {"n": 7, "t": "ABC is an equilateral triangle and BD ⊥ AC. What is x?", "o": {"A": "20°", "B": "25°", "C": "30°", "D": "35°"}, "a": "C", "s": "In an equilateral triangle the altitude BD is also the bisector of ∠B.;;x = 60° ÷ 2 = 30°", "f": "f221_3"}, {"n": 8, "t": "m(∠C) = 90°. Find x by using the exterior angle at A.", "o": {"A": "45°", "B": "55°", "C": "65°", "D": "75°"}, "a": "A", "s": "The exterior angle at A: 3x = m(∠B) + m(∠C) = x + 90°.;;2x = 90°;;x = 45°", "f": "f221_4"}], "ch": 7}, {"n": 12, "title": "‘Mixed Test 6’", "qs": [{"n": 1, "t": "The interior angles of a triangle are proportional to 2, 3 and 4. What is the smallest angle of the triangle?", "o": {"A": "20°", "B": "40°", "C": "45°", "D": "60°"}, "a": "B", "s": "2k + 3k + 4k = 180° ⇒ 9k = 180° ⇒ k = 20°;;Smallest angle: 2k = 40°", "f": "f222_1"}, {"n": 2, "t": "E, B, C and D are collinear. What is x in degrees according to the exterior angles?", "o": {"A": "70°", "B": "75°", "C": "80°", "D": "85°"}, "a": "A", "s": "m(∠B) = 180° – 120° = 60° and m(∠C) = 180° – 130° = 50°.;;x = 180° – 60° – 50°;;x = 70°", "f": "f222_2"}, {"n": 3, "t": "AB ⊥ BC and B, C, D are collinear. What is x in degrees?", "o": {"A": "40°", "B": "45°", "C": "50°", "D": "55°"}, "a": "C", "s": "m(∠ACB) = 180° – 140° = 40°.;;Right triangle: x + 40° = 90°;;x = 50°", "f": "f222_3"}, {"n": 4, "t": "|AB| = |AC| and B, A, E are collinear. Find x.", "o": {"A": "25", "B": "30", "C": "35", "D": "40"}, "a": "D", "s": "The base angles are both x + 10°.;;The exterior angle at A: 3x – 20° = 2(x + 10°);;3x – 20° = 2x + 20° ⇒ x = 40", "f": "f222_4"}, {"n": 5, "t": "m(∠A) = 90°. Find x by using the exterior angles.", "o": {"A": "34", "B": "44", "C": "54", "D": "64"}, "a": "C", "s": "The exterior angle at A is 180° – 90° = 90°.;;90° + 2x + 3x = 360°;;5x = 270° ⇒ x = 54", "f": "f223_1"}, {"n": 6, "t": "ABC is an equilateral triangle and BD is the bisector of ∠ABC. What is m(∠BDC)?", "o": {"A": "60°", "B": "90°", "C": "95°", "D": "120°"}, "a": "B", "s": "m(∠ABD) = m(∠DBC) = 30° and m(∠C) = 60°.;;Triangle BDC: m(∠BDC) = 180° – 30° – 60°;;m(∠BDC) = 90°", "f": "f223_2"}, {"n": 7, "t": "|AB| = |AC|. What is m(∠BAC)?", "o": {"A": "20°", "B": "30°", "C": "40°", "D": "50°"}, "a": "D", "s": "The base angles are both x + 40°.;;2x + 2(x + 40°) = 180° ⇒ 4x = 100° ⇒ x = 25;;m(∠BAC) = 2x = 50°", "f": "f223_3"}, {"n": 8, "t": "D ∈ [BC] and |AD| = |BD|. What is x?", "o": {"A": "60°", "B": "70°", "C": "80°", "D": "90°"}, "a": "B", "s": "|AD| = |BD|: triangle ABD is isosceles, m(∠BAD) = m(∠B) = 35°.;;x is an exterior angle of triangle ABD.;;x = 35° + 35° = 70°", "f": "f223_4"}], "ch": 7}, {"n": 13, "title": "‘Challenge Test 1’", "qs": [{"n": 1, "t": "|AB| = |AC|, B, C, D are collinear and BE is the bisector of ∠ABC. What is x?", "o": {"A": "95°", "B": "100°", "C": "105°", "D": "110°"}, "a": "C", "s": "m(∠ACB) = 180° – 110° = 70° = m(∠ABC), so m(∠A) = 40°.;;BE is the bisector: m(∠ABE) = 35°.;;Triangle ABE: x = 180° – 40° – 35° = 105°", "f": "f224_1"}, {"n": 2, "t": "m(∠BAC) = 90°, AD ⊥ BC and AE is the bisector of ∠DAC. What is x?", "o": {"A": "65°", "B": "55°", "C": "60°", "D": "70°"}, "a": "A", "s": "m(∠BAC) = 90° and AD ⊥ BC, so m(∠DAC) = m(∠B) = 50°.;;AE is the bisector: m(∠DAE) = 25°.;;Triangle ADE: x = 90° – 25° = 65°", "f": "f224_2"}, {"n": 3, "t": "|AB| = |AC|. Find m(∠BAC) by using the exterior angles.", "o": {"A": "48°", "B": "52°", "C": "56°", "D": "64°"}, "a": "B", "s": "Let m(∠B) = m(∠C) = b. The exterior angle at A is 2b = 4x, so b = 2x.;;Exterior angle at B: 3x + 20° = 180° – 2x ⇒ 5x = 160° ⇒ x = 32;;b = 64°, so m(∠BAC) = 180° – 128° = 52°", "f": "f224_3"}, {"n": 4, "t": "In triangle ABC, the bisectors of ∠B and ∠C meet at I. What is x?", "o": {"A": "115°", "B": "120°", "C": "135°", "D": "125°"}, "a": "D", "s": "m(∠B) + m(∠C) = 180° – 70° = 110°.;;Their halves add up to 55°.;;Triangle BIC: x = 180° – 55° = 125°", "f": "f224_4"}, {"n": 5, "t": "ABC is an equilateral triangle, |CD| = |CA| and m(∠ACD) = 90°. What is x?", "o": {"A": "95°", "B": "100°", "C": "105°", "D": "115°"}, "a": "C", "s": "m(∠ACD) = 90° and |CD| = |CA|: m(∠CAD) = 45°.;;x = m(∠BAC) + m(∠CAD) = 60° + 45°;;x = 105°", "f": "f225_1"}, {"n": 6, "t": "D ∈ [BC] and |AD| = |DC|. What is x?", "o": {"A": "55°", "B": "45°", "C": "50°", "D": "60°"}, "a": "A", "s": "Triangle ABD: m(∠ADB) = 180° – 40° – 30° = 110°, so m(∠ADC) = 70°.;;|AD| = |DC|: triangle ADC is isosceles, m(∠DAC) = m(∠C) = x.;;2x + 70° = 180° ⇒ x = 55°", "f": "f225_2"}, {"n": 7, "t": "m(∠C) = 90°. The exterior angle at A is 4 times m(∠B). What is x?", "o": {"A": "25°", "B": "30°", "C": "35°", "D": "40°"}, "a": "B", "s": "The exterior angle at A: 4x = m(∠B) + m(∠C) = x + 90°.;;3x = 90°;;x = 30°", "f": "f225_3"}, {"n": 8, "t": "D ∈ [AB], |AD| = |DC| and |CD| = |CB|. What is m(∠ACB)?", "o": {"A": "65°", "B": "70°", "C": "80°", "D": "75°"}, "a": "D", "s": "|AD| = |DC|: m(∠DCA) = m(∠A) = 35°, so m(∠CDB) = 70°.;;|CD| = |CB|: m(∠B) = 70°, so m(∠DCB) = 180° – 140° = 40°.;;m(∠ACB) = 35° + 40° = 75°", "f": "f225_4"}], "ch": 7}, {"n": 14, "title": "‘Challenge Test 2’", "qs": [{"n": 1, "t": "B, C, D are collinear. What is the measure of the biggest interior angle of triangle ABC?", "o": {"A": "60°", "B": "70°", "C": "80°", "D": "90°"}, "a": "B", "s": "Exterior angle: 4x – 10° = 2x + (x + 20°) ⇒ x = 30;;m(∠A) = 60°, m(∠B) = 50°, m(∠C) = 180° – 110° = 70°.;;Biggest angle: 70°", "f": "f226_1"}, {"n": 2, "t": "|AB| = |AC|, AH ⊥ BC and E, B, C are collinear. What is x?", "o": {"A": "115°", "B": "105°", "C": "125°", "D": "130°"}, "a": "A", "s": "|AB| = |AC| and AH ⊥ BC: triangle ABH has m(∠BAH) = 25°.;;m(∠ABH) = 90° – 25° = 65°;;x = 180° – 65° = 115°", "f": "f226_2"}, {"n": 3, "t": "ABC is an equilateral triangle, BD is the bisector of ∠ABC and DE ∥ BC. What is x?", "o": {"A": "20°", "B": "25°", "C": "30°", "D": "35°"}, "a": "C", "s": "BD is the bisector: m(∠DBC) = 30°.;;DE ∥ BC: x and ∠DBC are alternate interior angles.;;x = 30°", "f": "f226_3"}, {"n": 4, "t": "m(∠ABC) = 90° and DE ∥ BC. What is m(∠ACB)?", "o": {"A": "40°", "B": "45°", "C": "55°", "D": "50°"}, "a": "D", "s": "DE ∥ BC, so m(∠ADE) = m(∠ABC) = 90°.;;(x + 20°) + (2x + 10°) = 90° ⇒ x = 20 ⇒ m(∠AED) = 50°;;Corresponding angles: m(∠ACB) = m(∠AED) = 50°", "f": "f226_4"}, {"n": 5, "t": "Find the biggest interior angle of triangle ABC by using the exterior angles.", "o": {"A": "70°", "B": "74°", "C": "76°", "D": "80°"}, "a": "C", "s": "(2x + 40°) + (3x + 10°) + (5x – 10°) = 360° ⇒ 10x = 320° ⇒ x = 32;;Exterior angles: 104°, 106°, 150°. Interior angles: 76°, 74°, 30°.;;Biggest interior angle: 76°", "f": "f227_1"}, {"n": 6, "t": "|AB| = |AC| and the line d through A is parallel to BC. What is x?", "o": {"A": "80°", "B": "75°", "C": "70°", "D": "85°"}, "a": "A", "s": "d ∥ BC: m(∠B) = 50° (alternate interior angles).;;|AB| = |AC|: m(∠C) = 50°.;;x = m(∠BAC) = 180° – 100° = 80°", "f": "f227_2"}, {"n": 7, "t": "BD and CE meet at F. What is x?", "o": {"A": "100°", "B": "110°", "C": "120°", "D": "130°"}, "a": "B", "s": "Triangle AEC: m(∠AEC) = 180° – 60° – 30° = 90°, so m(∠BEF) = 90°.;;x is an exterior angle of triangle BEF.;;x = 90° + 20° = 110°", "f": "f227_3"}, {"n": 8, "t": "ABC is a right triangle with | AB| = |BC| and BCD is an equilateral triangle. What is x?", "o": {"A": "10°", "B": "20°", "C": "25°", "D": "15°"}, "a": "D", "s": "|AB| = |BC| = |BD|, so triangle ABD is isosceles.;;m(∠ABD) = 90° + 60° = 150°;;x = (180° – 150°) ÷ 2 = 15°", "f": "f227_4"}], "ch": 7}], "8": [{"n": 1, "title": "‘Angles Around Us’", "qs": [{"n": 1, "t": "What is the angle x between the hands of a clock at 2 o’clock?", "o": {"A": "30°", "B": "45°", "C": "60°", "D": "90°"}, "a": "C", "s": "Every hour on a clock face is 360° ÷ 12 = 30°.;;From 12 to 2 there are 2 hours.;;x = 2 · 30° = 60°", "f": "f236_1"}, {"n": 2, "t": "A door is opened so that it makes an angle of 110° with the wall on one side. What is the angle x between the door and the wall on the other side?", "o": {"A": "60°", "B": "70°", "C": "80°", "D": "110°"}, "a": "B", "s": "The door makes two adjacent angles on the straight wall.;;x + 110° = 180°;;x = 70°", "f": "f236_2"}, {"n": 3, "t": "The blades of a pair of scissors cross at point O and make an angle of 35°. What is the angle x between the handles?", "o": {"A": "35°", "B": "55°", "C": "145°", "D": "155°"}, "a": "A", "s": "The blades and the handles form vertical angles.;;Vertical angles are equal.;;x = 35°", "f": "f236_3"}, {"n": 4, "t": "A pizza is cut from the centre into 8 equal slices. What is the angle x of one slice?", "o": {"A": "45°", "B": "50°", "C": "60°", "D": "90°"}, "a": "A", "s": "The 8 slices fill the full angle around the centre.;;x = 360° ÷ 8 = 45°", "f": "f236_4"}, {"n": 5, "t": "The two rails of a railway are parallel. A road crosses the rails as in the figure. What is x?", "o": {"A": "70°", "B": "90°", "C": "110°", "D": "140°"}, "a": "C", "s": "The rails are parallel. The corresponding angle of 70° at the lower rail is also 70°.;;x is on a straight line with it: x = 180° – 70° = 110°", "f": "f237_1"}, {"n": 6, "t": "A torch lights an angle of 50°. The centre line of the light divides this angle into two equal parts. What is x?", "o": {"A": "20°", "B": "25°", "C": "30°", "D": "50°"}, "a": "B", "s": "The centre line is the bisector of the 50° angle.;;x = 50° ÷ 2 = 25°", "f": "f237_2"}, {"n": 7, "t": "Two straight streets cross each other. Two opposite angles at the crossing are 3x + 15° and 2x + 40°. Find x.", "o": {"A": "20", "B": "25", "C": "30", "D": "35"}, "a": "B", "s": "The two opposite angles are vertical angles, so they are equal.;;3x + 15° = 2x + 40°;;x = 25", "f": "f237_3"}, {"n": 8, "t": "The angles between the three blades of a ceiling fan are 2x, 3x and 4x. What is the biggest angle?", "o": {"A": "100°", "B": "120°", "C": "140°", "D": "160°"}, "a": "D", "s": "The three angles fill the full angle.;;2x + 3x + 4x = 360° ⇒ 9x = 360° ⇒ x = 40°;;Biggest angle: 4x = 160°", "f": "f237_4"}], "ch": 8}, {"n": 2, "title": "‘Triangles Around Us’", "qs": [{"n": 1, "t": "The roof of a house is an isosceles triangle with a top angle of 110°. What is the base angle x?", "o": {"A": "35°", "B": "45°", "C": "55°", "D": "70°"}, "a": "A", "s": "Isosceles triangle: the base angles are equal.;;110° + 2x = 180° ⇒ 2x = 70°;;x = 35°", "f": "f238_1"}, {"n": 2, "t": "A set square has a right angle and an angle of 60°. What is its third angle x?", "o": {"A": "20°", "B": "30°", "C": "40°", "D": "45°"}, "a": "B", "s": "The angles of the triangle add up to 180°.;;x + 90° + 60° = 180°;;x = 30°", "f": "f238_2"}, {"n": 3, "t": "A ladder leans against a vertical wall and makes a 65° angle with the ground. What is the angle x between the ladder and the wall?", "o": {"A": "25°", "B": "35°", "C": "45°", "D": "115°"}, "a": "A", "s": "The wall, the ground and the ladder form a right triangle.;;x + 65° = 90°;;x = 25°", "f": "f238_3"}, {"n": 4, "t": "A warning road sign is an equilateral triangle. B, C and D are collinear. What is the exterior angle x?", "o": {"A": "60°", "B": "90°", "C": "120°", "D": "150°"}, "a": "C", "s": "Each interior angle of an equilateral triangle is 60°.;;The exterior angle: x = 180° – 60°;;x = 120°", "f": "f238_4"}, {"n": 5, "t": "The front of a tent is an isosceles triangle with base angles of 65°. What is the top angle x?", "o": {"A": "40°", "B": "50°", "C": "60°", "D": "65°"}, "a": "B", "s": "x + 65° + 65° = 180°;;x = 180° – 130°;;x = 50°", "f": "f239_1"}, {"n": 6, "t": "A vertical pole and its shadow make a right angle. The sun’s rays make a 40° angle with the ground. What is the angle x at the top of the pole?", "o": {"A": "30°", "B": "40°", "C": "50°", "D": "60°"}, "a": "C", "s": "The pole, the shadow and the sun ray form a right triangle.;;x + 40° = 90°;;x = 50°", "f": "f239_2"}, {"n": 7, "t": "The angles of a triangular flag are proportional to 2, 3 and 4. What is the measure of the biggest angle?", "o": {"A": "70°", "B": "75°", "C": "80°", "D": "85°"}, "a": "C", "s": "2k + 3k + 4k = 180° ⇒ 9k = 180° ⇒ k = 20°;;Biggest angle: 4k = 80°", "f": "f239_3"}, {"n": 8, "t": "A bridge has a support shaped like triangle ABC. B, C and D are collinear. What is x?", "o": {"A": "50°", "B": "55°", "C": "60°", "D": "65°"}, "a": "D", "s": "115° is the exterior angle at C.;;115° = 50° + x;;x = 65°", "f": "f239_4"}], "ch": 8}, {"n": 3, "title": "‘Geometry in Daily Life – Mixed’", "qs": [{"n": 1, "t": "Two shelves are parallel. A support makes a 55° angle with the upper shelf. What is x?", "o": {"A": "35°", "B": "45°", "C": "55°", "D": "125°"}, "a": "C", "s": "The shelves are parallel: x and 55° are alternate interior angles.;;x = 55°", "f": "f240_1"}, {"n": 2, "t": "The legs of an ironing board cross like the letter X. The angle between the legs at the top is 50°. What is x?", "o": {"A": "130°", "B": "140°", "C": "150°", "D": "160°"}, "a": "A", "s": "50° and x are adjacent angles on a straight line (one leg).;;x = 180° – 50°;;x = 130°", "f": "f240_2"}, {"n": 3, "t": "What is the angle x between the hands of a clock at 4 o’clock?", "o": {"A": "90°", "B": "100°", "C": "110°", "D": "120°"}, "a": "D", "s": "Every hour is 30°. From 12 to 4 there are 4 hours.;;x = 4 · 30° = 120°", "f": "f240_3"}, {"n": 4, "t": "A triangular garden has two angles of 50° and 60°. What is its third angle x?", "o": {"A": "60°", "B": "70°", "C": "80°", "D": "90°"}, "a": "B", "s": "The angles of a triangle add up to 180°.;;x + 50° + 60° = 180°;;x = 70°", "f": "f240_4"}, {"n": 5, "t": "A garden sprinkler waters a full circle in three parts. Two parts are 100° and 125°. What is the third part x?", "o": {"A": "115°", "B": "125°", "C": "135°", "D": "145°"}, "a": "C", "s": "The three parts fill the full angle.;;x + 100° + 125° = 360°;;x = 135°", "f": "f241_1"}, {"n": 6, "t": "A slide makes a 35° angle with the ground and its ladder is vertical. What is the angle x between the slide and the ladder?", "o": {"A": "45°", "B": "55°", "C": "65°", "D": "145°"}, "a": "B", "s": "The ladder, the ground and the slide form a right triangle.;;x + 35° = 90°;;x = 55°", "f": "f241_2"}, {"n": 7, "t": "The handrail of a staircase is parallel to the stairs. A vertical post makes a 125° angle with the handrail. What is x?", "o": {"A": "35°", "B": "45°", "C": "50°", "D": "55°"}, "a": "D", "s": "The handrail and the stairs are parallel; the post is a transversal.;;125° and x are co-interior angles: x + 125° = 180°;;x = 55°", "f": "f241_3"}, {"n": 8, "t": "A coat hanger is an isosceles triangle. Its top angle is 3x and each base angle is x + 10°. What is the top angle?", "o": {"A": "84°", "B": "90°", "C": "96°", "D": "102°"}, "a": "C", "s": "3x + (x + 10°) + (x + 10°) = 180°;;5x + 20° = 180° ⇒ x = 32;;Top angle: 3x = 96°", "f": "f241_4"}], "ch": 8}, {"n": 4, "title": "‘Daily Life Challenge 1’", "qs": [{"n": 1, "t": "In half an hour the hour hand moves 15°. What is the angle x between the hands of a clock at 3:30?", "o": {"A": "60°", "B": "75°", "C": "80°", "D": "90°"}, "a": "B", "s": "At 3:00 the hour hand is at 3 · 30° = 90°. At 3:30 it is at 90° + 15° = 105°.;;The minute hand is at 180°.;;x = 180° – 105° = 75°", "f": "f242_1"}, {"n": 2, "t": "Two ladders of equal length form an A-shape with a 50° angle at the top. A bar between them is parallel to the ground. What is x?", "o": {"A": "55°", "B": "75°", "C": "65°", "D": "115°"}, "a": "C", "s": "The A-shape is an isosceles triangle: base angles = (180° – 50°) ÷ 2 = 65°.;;The bar is parallel to the ground: corresponding angles.;;x = 65°", "f": "f242_2"}, {"n": 3, "t": "A light ray hits a mirror and is reflected with an equal angle. What is the angle x between the two rays?", "o": {"A": "110°", "B": "100°", "C": "120°", "D": "145°"}, "a": "A", "s": "Both angles with the mirror are 35°.;;Straight angle: 35° + x + 35° = 180°;;x = 110°", "f": "f242_3"}, {"n": 4, "t": "The roof is an isosceles triangle with a top angle of 120°. A vertical support goes from the top to the middle of the base. What is x?", "o": {"A": "30°", "B": "45°", "C": "75°", "D": "60°"}, "a": "D", "s": "In an isosceles triangle the support to the middle of the base is also the bisector of the top angle.;;x = 120° ÷ 2 = 60°", "f": "f242_4"}, {"n": 5, "t": "Two cables join a point on a vertical pole to the ground. They make 50° and 70° with the ground. What is the angle x between the cables?", "o": {"A": "50°", "B": "70°", "C": "60°", "D": "120°"}, "a": "C", "s": "Left right triangle: 90° – 50° = 40°.;;Right right triangle: 90° – 70° = 20°.;;x = 40° + 20° = 60°", "f": "f243_1"}, {"n": 6, "t": "A kite has |AB| = |AD| and |CB| = |CD|. What is x?", "o": {"A": "100°", "B": "120°", "C": "110°", "D": "130°"}, "a": "B", "s": "The kite is symmetric: m(∠B) = m(∠D) = x.;;The angles of the kite add up to 360°: 80° + 40° + 2x = 360°;;2x = 240° ⇒ x = 120°", "f": "f243_2"}, {"n": 7, "t": "Two vertical poles stand on flat ground and the sun rays are parallel. What is x?", "o": {"A": "35°", "B": "45°", "C": "65°", "D": "55°"}, "a": "D", "s": "The sun rays are parallel, so they make 35° with the ground at both poles.;;Right triangle at the second pole: x + 35° = 90°;;x = 55°", "f": "f243_3"}, {"n": 8, "t": "A paper strip with parallel edges is folded along the fold line. What is x?", "o": {"A": "40°", "B": "30°", "C": "50°", "D": "70°"}, "a": "A", "s": "When the strip is folded, the two angles at the fold line are equal: 70° and 70°.;;Straight line: x + 70° + 70° = 180°;;x = 40°", "f": "f243_4"}], "ch": 8}, {"n": 5, "title": "‘Daily Life Challenge 2’", "qs": [{"n": 1, "t": "In 20 minutes the hour hand moves 10°. What is the angle x between the hands of a clock at 9:20?", "o": {"A": "150°", "B": "160°", "C": "170°", "D": "180°"}, "a": "B", "s": "At 9:20 the hour hand is at 9 · 30° + 10° = 280°.;;The minute hand (4) is at 4 · 30° = 120°.;;x = 280° – 120° = 160°", "f": "f244_1"}, {"n": 2, "t": "The two bars of a scissor lift have equal halves and cross at their middle. The top platform is parallel to the ground. What is x?", "o": {"A": "45°", "B": "65°", "C": "55°", "D": "110°"}, "a": "C", "s": "The halves are equal: the upper triangle is isosceles with a 70° top angle.;;Base angles: (180° – 70°) ÷ 2 = 55°.;;The platform is parallel to the ground: x = 55°", "f": "f244_2"}, {"n": 3, "t": "Two ladders stand at the same point on the ground and lean on two walls. What is the angle x between the ladders?", "o": {"A": "75°", "B": "65°", "C": "85°", "D": "105°"}, "a": "A", "s": "The three angles at the point are on the straight ground.;;60° + x + 45° = 180°;;x = 75°", "f": "f244_3"}, {"n": 4, "t": "The front of a tent is an isosceles triangle. The middle pole is vertical and makes 25° with the side. What is x?", "o": {"A": "55°", "B": "60°", "C": "70°", "D": "65°"}, "a": "D", "s": "The middle pole is the bisector: the top angle is 2 · 25° = 50°.;;Right triangle: x + 25° = 90°;;x = 65°", "f": "f244_4"}, {"n": 5, "t": "The frame of a bicycle forms triangle ABC. B, C, D are collinear. What is x?", "o": {"A": "45°", "B": "65°", "C": "55°", "D": "75°"}, "a": "C", "s": "115° is the exterior angle at C.;;115° = 60° + x;;x = 55°", "f": "f245_1"}, {"n": 6, "t": "The two long sides of a billiard table are parallel. The ball bounces with equal angles. What is x?", "o": {"A": "50°", "B": "40°", "C": "80°", "D": "100°"}, "a": "B", "s": "The long sides are parallel: x and 40° are alternate interior angles.;;x = 40°", "f": "f245_2"}, {"n": 7, "t": "A triangular traffic island lies between two parallel roads. What is x?", "o": {"A": "80°", "B": "60°", "C": "90°", "D": "70°"}, "a": "D", "s": "The roads are parallel: the base angles of the triangle are 50° and 60° (alternate interior angles).;;x = 180° – 50° – 60°;;x = 70°", "f": "f245_3"}, {"n": 8, "t": "Five chairs stand around a round table with equal angles between them. What is the angle x between chair 1 and chair 3?", "o": {"A": "144°", "B": "108°", "C": "120°", "D": "150°"}, "a": "A", "s": "The 5 equal angles fill the full angle: 360° ÷ 5 = 72°.;;From chair 1 to chair 3 there are 2 parts.;;x = 2 · 72° = 144°", "f": "f245_4"}], "ch": 8}]};

/* Preface */
add(0,`<span class="pill">Preface</span><div class="ind"><p style="text-indent:0"><b class="t">Dear students, dear teachers,</b></p>
<p>Mathematics is a language, and like every language it is learned step by step. Elementary Mathematics and Geometry 1 was written to make these first steps clear, enjoyable and strong. It is the first book of the Elementary Mathematics series and it is suitable for grade 5 and above.</p>
<p>The book has eight chapters. In Numbers you will meet the number sets N, W and Z and learn how numbers are classified. In 4 Fundamental Operations you will add, subtract, multiply and divide positive and negative numbers and show these operations on the number line. In Order of Operations you will learn the BEDMAS rule and solve expressions with brackets, exponentials and radicals without confusion. In Equations you will learn to find the undefined number x in first degree equations. In Number Problems you will turn words into operations. In Angles on a Line and Angles in a Triangle you will meet the first rules of geometry, and in Geometry in Daily Life you will use them to solve real-life problems.</p>
<p>Every chapter follows the same friendly plan. The chapter cover shows the objectives, the key words, a short history note and a small research task. The next page introduces a famous mathematician connected to the topic. Then come clear definitions, INFO notes, RULE boxes and many solved examples, from the easiest to the hardest. The exercises follow the lessons, and an illustrated dictionary explains the key words of the cover. The answer keys at the end of the book help you to check your own work.</p>
<p>In total the book contains 196 solved examples, 20 extra information notes, 17 rule boxes, 54 exercises, 620 questions and 1,525 options, all with answer keys, for classroom teaching and extra practice.</p></div>
<p><b class="t"><i>We wish you success and joy on your mathematical journey.</i></b></p><p style="text-align:right"><b class="t">The Author</b> · <span class="ph">[place]</span>, <span class="ph">[year]</span></p>
${I('In this online edition every exercise can be checked instantly: write your answer, then press <b>✔ Check</b>.')}`,'Preface');

/* Tips */
add(0,`<span class="pill">Tips for learning mathematics</span><div class="ind">
<p style="text-indent:0">Learning mathematics is a lot like setting out on a journey, or starting a brand-new game. You can think of each chapter in this book as a level that gets a little harder than the last — except this game is played with numbers, shapes and symbols. Sometimes new symbols join the game (like √, π or ∞); sometimes numbers shrink and climb up to sit as an exponent on top of another number; sometimes letters even take the place of numbers. At first this can feel confusing, just like learning the rules of a brand-new game — but every new rule carries you to the next level.</p>
<p>Here's what matters most: while you're playing, your numerical thinking, your perspective on everyday situations, and even your reaction time are all quietly growing. You're learning to try different paths toward a solution, to stay patient, and to move forward step by logical step. You might not notice the effect on your everyday life right away — maybe only years from now, while weighing a decision quickly, planning a budget, or breaking a complicated problem into smaller pieces, will you realize how much this skill has been helping you all along. But its impact is certain to be enormous, and it lasts a lifetime.</p>
<p>The single biggest secret to learning mathematics is actually very simple: <b class="t">never give up.</b> Don't hesitate to ask your teacher about even the smallest detail you don't understand, no matter how unimportant it may seem — because a tiny gap today can turn into a big obstacle at the next level.</p>
<p>Remember, every mathematician was once learning these very terms for the first time, just like you. <b class="t">Now it's your turn!</b></p></div>`,'Tips for Learning Mathematics');

add(1,`<h2 class="h1">1. NUMBER SETS</h2>
<p>We use the numbers in life very frequently while counting the money, telling the temperature of weather or the time.</p>
<p>Numbers have been classified in different number sets. We will look through these number sets which are used the most while calculating 4 fundamental operations.</p>
<p><b class="t">Natural Numbers:</b> Starting from 1 up to positive infinity.</p><p class="ctr">{1, 2, 3, 4, ...}</p>
<p>The capital “N” represents natural numbers set.</p><p class="ctr">N = {1, 2, 3, 4, ...}</p>
${E('51, 173, 4198, 35736419 are natural numbers.')}
${I('The smallest natural number is 1. The biggest natural number is undefined because natural numbers go to the positive infinity.')}
${I('The natural numbers are also called as a counting number.')}
<p><b class="t">Whole Numbers:</b> Starting from 0 up to positive infinity.</p><p class="ctr">{0, 1, 2, 3, 4, ...}</p>
<p>The capital “W” represents whole numbers set.</p><p class="ctr">W = {0, 1, 2, 3, 4, ...}</p>
${E('0, 77, 819, 9714, 54690114 are whole numbers. In this example all the numbers are also natural numbers except 0.')}
${I('The smallest whole number is 0.')}
${I('The difference between whole numbers and natural numbers in terms of a number is 0. 0 is a whole number but it is not a natural number.')}`,'1. Number Sets',1);

add(1,`<p><b class="t">Integers:</b> Starting from negative infinity up to positive infinity.</p><p class="ctr">{..., –3, –2, –1, 0, 1, 2, 3, ...}</p>
<p>The capital “Z” represents integers.</p><p class="ctr">Z = {..., –3, –2, –1, 0, 1, 2, 3, ...}</p>
${E('–9174, –809, –74, 0, 41, 708, 1198 are integers.')}
${I('We can’t talk about the smallest or the biggest integer because it starts from negative infinity up to positive infinity.')}
<p>We can divide integers into positive and negative integers.</p>
<p><b>Negative integers</b> are represented by “Z<sup>–</sup>” symbol. It starts from negative infinity up to –1.</p><p class="ctr">Z<sup>–</sup> = {..., –4, –3, –2, –1}</p>
${E('–314, –210, –37, –14 are negative integers.')}
${I('The biggest negative integer is –1.')}
${I('Negative integers have “–” sign before numbers. It means if the value of number decreasing, the positive value of this number is increasing.')}
${E('1 is smaller than 2 but in the negative integers –1 is bigger than –2.<br>–10 is bigger than –27.')}
<p><b>Positive integers</b> are represented by “Z<sup>+</sup>” symbol. It starts from 1 up to positive infinity.</p><p class="ctr">Z<sup>+</sup> = {1, 2, 3, 4, ...}</p>
${I('The smallest positive integer is 1.')}
${I('0 is neither positive nor negative. 0 is a neutral.')}
${I('There is not any difference between natural numbers and positive integers. Both number sets are starting from 1 up to positive infinity.')}
<p>We will look through another number sets like rational numbers, irrational numbers and real numbers in another book.</p>
<p>For the beginning, it is enough to learn. Don’t forget that you are going to improve your calculation ability.</p>`,null);
